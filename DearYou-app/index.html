<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DearYou - Web Ucapan Digital Romantis</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fredoka:wght@500;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            cursive: ['"Dancing Script"', 'cursive'],
            cartoon: ['"Fredoka"', 'cursive'],
            tech: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Mencegah Flash / Unstyled Screen di Browser HP -->
  <style>
    [x-cloak] { display: none !important; }
    .polaroid-shadow {
      box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f43f5e;
      border-radius: 10px;
    }
  </style>

  <!-- Script Eksternal (Dimuat terurut untuk menghindari crash di mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- File app.js dipanggil sebelum Alpine.js -->
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-rose-50/50 text-slate-800 antialiased min-h-screen flex flex-col font-sans custom-scrollbar" x-data="window.dearyouApp()" x-init="initApp()" x-cloak>

  <!-- NAVBAR HEADER -->
  <header x-show="viewMode !== 'public'" class="bg-white/80 backdrop-blur-md border-b border-rose-100 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" @click="viewMode = 'dashboard'">
        <span class="text-2xl">💖</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-rose-500 to-pink-600 bg-clip-text text-transparent font-serif">DearYou</h1>
      </div>
      <template x-if="viewMode === 'dashboard'">
        <button @click="createNewProject('anniversary')" class="bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-md shadow-rose-200 transition-all flex items-center gap-1.5 active:scale-95">
          <span>✨ Buat Ucapan Baru</span>
        </button>
      </template>
      <template x-if="viewMode === 'editor'">
        <button @click="viewMode = 'dashboard'" class="text-slate-500 hover:text-slate-700 text-sm font-medium flex items-center gap-1">
          ⬅️ Kembali ke Dashboard
        </button>
      </template>
    </div>
  </header>

  <!-- TOAST NOTIFICATION -->
  <div x-show="copiedToast" 
       x-transition:enter="transition ease-out duration-300 transform"
       x-transition:enter-start="opacity-0 translate-y-4"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-200 transform"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 translate-y-4"
       class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-800">
    <span class="text-lg">✨</span>
    <p class="text-sm font-medium" x-text="toastMessage"></p>
  </div>

  <!-- LOADING OVERLAY -->
  <div x-show="isLoading" class="fixed inset-0 bg-white/70 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <div class="w-10 h-10 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm font-semibold text-rose-600 animate-pulse">Memuat data cloud...</p>
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">

    <!-- VIEW 1: DASHBOARD -->
    <div x-show="viewMode === 'dashboard'" class="space-y-6">
      
      <!-- Banner -->
      <div class="bg-gradient-to-r from-rose-500 to-pink-600 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-rose-200 relative overflow-hidden">
        <div class="relative z-10 max-w-xl">
          <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-sm">Platform Ucapan Digital</span>
          <h2 class="text-2xl md:text-3xl font-bold font-serif mt-3">Buat Kenangan Indah Bersama Pasanganmu 💌</h2>
          <p class="mt-2 text-rose-100 text-sm leading-relaxed">Buat link ucapan digital estetik dengan musik, galeri foto, dan hitungan waktu momen spesial kalian.</p>
          <button @click="createNewProject('anniversary')" class="mt-5 bg-white text-rose-600 font-bold px-5 py-2.5 rounded-full text-sm shadow-md hover:bg-rose-50 transition-all active:scale-95">
            + Mulai Buat Ucapan Gratis
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex items-center justify-between border-b border-rose-100 pb-3">
        <div class="flex gap-2">
          <button @click="switchTab('my_projects')" 
                  class="px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2"
                  :class="activeTab === 'my_projects' ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'bg-white text-slate-600 hover:bg-rose-50'">
            📂 Milik Saya
          </button>
          <button @click="switchTab('global')" 
                  class="px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2"
                  :class="activeTab === 'global' ? 'bg-rose-500 text-white shadow-md shadow-rose-200' : 'bg-white text-slate-600 hover:bg-rose-50'">
            🌐 Global (Inspirasi)
          </button>
        </div>
        <span class="text-xs text-slate-500 font-medium" x-text="`${projects.length} Ucapan`"></span>
      </div>

      <!-- Empty State -->
      <template x-if="projects.length === 0 && !isLoading">
        <div class="bg-white border-2 border-dashed border-rose-200 rounded-3xl p-10 text-center space-y-3">
          <div class="text-4xl" x-text="activeTab === 'my_projects' ? '💌' : '🔍'"></div>
          <h4 class="font-bold text-slate-700" x-text="activeTab === 'my_projects' ? 'Belum Ada Ucapan Dibuat' : 'Belum Ada Ucapan Publik'"></h4>
          <p class="text-xs text-slate-500 max-w-xs mx-auto" x-text="activeTab === 'my_projects' ? 'Klik tombol di bawah untuk membuat kartu ucapan romantis pertama kamu!' : 'Belum ada ucapan yang dipublikasikan secara umum.'"></p>
          <template x-if="activeTab === 'my_projects'">
            <button @click="createNewProject('anniversary')" class="bg-rose-500 text-white text-xs font-bold px-4 py-2 rounded-full shadow-md">Buat Sekarang</button>
          </template>
        </div>
      </template>

      <!-- Project Cards -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="p in projects" :key="p.id">
          <div class="bg-white rounded-2xl border border-rose-100 p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between space-y-4">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-rose-100 text-rose-600" x-text="getBadgeText(p.type)"></span>
                <span class="text-xs text-slate-400" x-text="formatDate(p.startDate)"></span>
              </div>
              <h4 class="font-bold text-slate-800 text-base line-clamp-1" x-text="p.title || 'Tanpa Judul'"></h4>
              <p class="text-xs text-slate-500 mt-1 line-clamp-2" x-text="p.message || 'Belum ada pesan ucapan...'"></p>
            </div>

            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <button @click="copyShareLink(p)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-xl transition-all flex items-center justify-center gap-1">
                📋 Copy Link
              </button>
              <button @click="openPreview(p)" class="bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-semibold px-3 py-2 rounded-xl transition-all">
                👁️
              </button>
              <template x-if="currentUser && p.userId === currentUser.id">
                <div class="flex items-center gap-1">
                  <button @click="editProject(p)" class="bg-slate-50 text-slate-600 hover:bg-slate-100 text-xs font-semibold px-3 py-2 rounded-xl transition-all">
                    ✏️
                  </button>
                  <button @click="deleteProject(p.id)" class="bg-rose-50 text-rose-500 hover:bg-rose-100 text-xs font-semibold px-3 py-2 rounded-xl transition-all">
                    🗑️
                  </button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- VIEW 2: EDITOR -->
    <div x-show="viewMode === 'editor'" class="max-w-2xl mx-auto space-y-6">
      <div class="bg-white rounded-3xl p-6 border border-rose-100 shadow-xl space-y-5">
        <h2 class="text-xl font-bold font-serif text-slate-800 border-b border-rose-100 pb-3">Edit Ucapan Digital</h2>

        <!-- Kategori -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Kategori Momen</label>
          <select x-model="activeProject.type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rose-500">
            <option value="anniversary">❤️ Anniversary / Tanggal Jadian</option>
            <option value="birthday">🎂 Ulang Tahun (Birthday)</option>
            <option value="valentine">🌹 Valentine / Ungkapan Cinta</option>
          </select>
        </div>

        <!-- Pilihan Tema Desain -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pilih Tema & Gaya Tampilan</label>
          <select x-model="activeProject.theme" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rose-500 font-semibold">
            <option value="vintage_scrapbook">🌸 Vintage Scrapbook (Klasik & Romantis)</option>
            <option value="dark">🌙 Dark Romantic (Sleek, Neon & Futuristic)</option>
            <option value="pastel">🦄 Pastel Dream (Soft, Cute & Bubble)</option>
            <option value="kartun">🎨 Pop Art Kartun (Bold, Playful & Komik)</option>
          </select>
        </div>

        <!-- Judul -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Judul Utama</label>
          <input type="text" x-model="activeProject.title" placeholder="Contoh: Happy 2nd Anniversary Sayang ❤️" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rose-500" />
        </div>

        <!-- Tanggal -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Tanggal Spesial / Mulai</label>
          <input type="date" x-model="activeProject.startDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rose-500" />
        </div>

        <!-- Backsound -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">URL Lagu MP3 (Backsound)</label>
          <input type="url" x-model="activeProject.audioUrl" placeholder="https://domain.com/lagu-romantis.mp3" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rose-500" />
        </div>

        <!-- Photos -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">URL Foto Kenangan</label>
            <button @click="addPhoto()" class="text-xs text-rose-600 font-bold hover:underline">+ Tambah Foto</button>
          </div>
          <template x-for="(photo, index) in activeProject.photos" :key="index">
            <div class="flex items-center gap-2">
              <input type="url" x-model="activeProject.photos[index]" placeholder="https://images.unsplash.com/..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-rose-500" />
              <button @click="removePhoto(index)" class="bg-rose-100 text-rose-600 px-3 py-2 rounded-xl text-xs font-bold">Hapus</button>
            </div>
          </template>
        </div>

        <!-- Message -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Surat / Pesan Romantis</label>
          <textarea x-model="activeProject.message" rows="5" placeholder="Tuliskan kata-kata indah untuk pasanganmu di sini..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-rose-500"></textarea>
        </div>

        <!-- Checkbox Publik -->
        <div class="flex items-center gap-2.5 bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100">
          <input type="checkbox" id="isPublic" x-model="activeProject.isPublic" class="w-4 h-4 text-rose-600 rounded border-slate-300 focus:ring-rose-500 cursor-pointer">
          <label for="isPublic" class="text-xs font-semibold text-slate-700 cursor-pointer select-none">
            🌐 Dipublikasikan secara Global (Dapat dilihat oleh publik di tab Inspirasi)
          </label>
        </div>

        <div class="pt-4 border-t border-slate-100 flex flex-wrap gap-3">
          <button @click="saveProject('published')" class="flex-1 bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-rose-200 text-sm hover:opacity-95 transition-all">
            💾 Simpan ke Cloud Database
          </button>
          <button @click="openPreview(activeProject)" class="bg-rose-50 text-rose-600 font-bold px-5 py-3 rounded-2xl text-sm hover:bg-rose-100 transition-all">
            👁️ Preview Tampilan
          </button>
        </div>
      </div>
    </div>

    <!-- VIEW 3: PUBLIC / PREVIEW -->
    <div x-show="viewMode === 'public'" 
         class="min-h-screen -m-4 md:-m-6 flex flex-col items-center justify-center p-4 relative overflow-hidden transition-colors duration-500"
         :class="{
           'bg-gradient-to-b from-rose-100 via-pink-50 to-rose-100 text-slate-800': activeProject.theme === 'vintage_scrapbook' || !activeProject.theme,
           'bg-slate-950 text-slate-100': activeProject.theme === 'dark',
           'bg-gradient-to-br from-purple-100 via-pink-100 to-blue-100 text-slate-800': activeProject.theme === 'pastel',
           'bg-yellow-200 text-black': activeProject.theme === 'kartun'
         }">
      
      <audio id="bgAudio" :src="activeProject.audioUrl" loop></audio>

      <!-- Back Button -->
      <div class="fixed top-4 left-4 z-50">
        <button @click="goBackFromPreview()" class="bg-white/80 backdrop-blur-md text-slate-700 px-4 py-2 rounded-full text-xs font-bold shadow-md border border-rose-200 flex items-center gap-1">
          ⬅️ Kembalikan Tampilan
        </button>
      </div>

      <!-- Music Player Floating Button -->
      <div class="fixed top-4 right-4 z-50">
        <button @click="toggleAudio()" class="p-3 rounded-full shadow-lg hover:scale-105 transition-all flex items-center justify-center"
                :class="activeProject.theme === 'dark' ? 'bg-rose-600 text-white shadow-rose-900/50' : 'bg-rose-500 text-white'">
          <span x-text="isAudioPlaying ? '🔊' : '🎵'"></span>
        </button>
      </div>

      <!-- ================= TEMA 1: VINTAGE SCRAPBOOK ================= -->
      <template x-if="activeProject.theme === 'vintage_scrapbook' || !activeProject.theme">
        <div class="max-w-md w-full my-12 bg-white/90 backdrop-blur-md rounded-3xl p-6 md:p-8 shadow-2xl border border-rose-200/60 text-center space-y-6 relative">
          <div>
            <span class="inline-block bg-rose-100 text-rose-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest" x-text="getBadgeText(activeProject.type)"></span>
          </div>

          <h1 class="text-2xl md:text-3xl font-serif font-bold text-slate-800 leading-tight" x-text="activeProject.title || 'Dear My Love'"></h1>

          <div class="bg-rose-50/80 rounded-2xl p-4 border border-rose-100">
            <p class="text-xs font-semibold text-rose-500 uppercase tracking-wider mb-2" x-text="getCounterTitle(activeProject.type)"></p>
            <div class="grid grid-cols-3 gap-2 text-slate-800">
              <div class="bg-white p-2 rounded-xl border border-rose-100 shadow-sm">
                <span class="block text-xl font-bold font-serif text-rose-600" x-text="calculateDays(activeProject.startDate).years"></span>
                <span class="text-[10px] text-slate-500 uppercase font-semibold">Tahun</span>
              </div>
              <div class="bg-white p-2 rounded-xl border border-rose-100 shadow-sm">
                <span class="block text-xl font-bold font-serif text-rose-600" x-text="calculateDays(activeProject.startDate).months"></span>
                <span class="text-[10px] text-slate-500 uppercase font-semibold">Bulan</span>
              </div>
              <div class="bg-white p-2 rounded-xl border border-rose-100 shadow-sm">
                <span class="block text-xl font-bold font-serif text-rose-600" x-text="calculateDays(activeProject.startDate).days"></span>
                <span class="text-[10px] text-slate-500 uppercase font-semibold">Hari</span>
              </div>
            </div>
            <p class="text-xs text-slate-500 mt-2 font-medium" x-text="`Total ${calculateDays(activeProject.startDate).totalDays} hari kebersamaan`"></p>
          </div>

          <div class="relative space-y-2">
            <div class="bg-white p-3 rounded-2xl polaroid-shadow border border-slate-100 rotate-1 transform hover:rotate-0 transition-all duration-300">
              <img :src="activeProject.photos[activePhotoIndex] || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=800'" class="w-full h-64 object-cover rounded-xl" />
            </div>
            <template x-if="activeProject.photos.length > 1">
              <div class="flex items-center justify-center gap-2 pt-1">
                <template x-for="(p, i) in activeProject.photos" :key="i">
                  <button @click="activePhotoIndex = i" class="w-2.5 h-2.5 rounded-full transition-all" :class="activePhotoIndex === i ? 'bg-rose-500 w-5' : 'bg-rose-200'"></button>
                </template>
              </div>
            </template>
          </div>

          <div class="bg-rose-50/50 p-5 rounded-2xl border border-rose-100 text-left">
            <p class="font-serif text-slate-700 text-sm whitespace-pre-line leading-relaxed italic" x-text="activeProject.message || 'Momen manis bersama...'"></p>
          </div>

          <div class="pt-2">
            <button @click="copyShareLink(activeProject)" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-rose-200 text-sm hover:opacity-95 transition-all flex items-center justify-center gap-2">
              <span>📋 Bagikan Link Ucapan Ini</span>
            </button>
          </div>
        </div>
      </template>

      <!-- ================= TEMA 2: DARK ROMANTIC ================= -->
      <template x-if="activeProject.theme === 'dark'">
        <div class="max-w-md w-full my-12 bg-slate-900/90 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl shadow-rose-950/50 border border-rose-500/20 text-center space-y-6 font-tech">
          <div>
            <span class="inline-block bg-rose-950 text-rose-400 border border-rose-800 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest" x-text="getBadgeText(activeProject.type)"></span>
          </div>

          <h1 class="text-2xl md:text-3xl font-bold text-rose-400 drop-shadow-[0_0_12px_rgba(244,63,94,0.4)]" x-text="activeProject.title || 'Dear My Love'"></h1>

          <div class="bg-slate-950/80 rounded-2xl p-4 border border-rose-500/30 shadow-inner">
            <p class="text-xs font-semibold text-rose-400 tracking-widest uppercase mb-3" x-text="getCounterTitle(activeProject.type)"></p>
            <div class="grid grid-cols-3 gap-2 text-slate-200">
              <div class="bg-slate-900/90 p-3 rounded-xl border border-rose-500/20">
                <span class="block text-2xl font-bold text-rose-400 drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]" x-text="calculateDays(activeProject.startDate).years"></span>
                <span class="text-[9px] text-slate-400 uppercase font-semibold">Tahun</span>
              </div>
              <div class="bg-slate-900/90 p-3 rounded-xl border border-rose-500/20">
                <span class="block text-2xl font-bold text-rose-400 drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]" x-text="calculateDays(activeProject.startDate).months"></span>
                <span class="text-[9px] text-slate-400 uppercase font-semibold">Bulan</span>
              </div>
              <div class="bg-slate-900/90 p-3 rounded-xl border border-rose-500/20">
                <span class="block text-2xl font-bold text-rose-400 drop-shadow-[0_0_8px_rgba(244,63,94,0.6)]" x-text="calculateDays(activeProject.startDate).days"></span>
                <span class="text-[9px] text-slate-400 uppercase font-semibold">Hari</span>
              </div>
            </div>
          </div>

          <div class="relative space-y-2">
            <div class="p-1.5 rounded-2xl bg-gradient-to-tr from-rose-600 via-purple-600 to-pink-500 shadow-lg shadow-rose-950">
              <img :src="activeProject.photos[activePhotoIndex] || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=800'" class="w-full h-64 object-cover rounded-xl" />
            </div>
            <template x-if="activeProject.photos.length > 1">
              <div class="flex items-center justify-center gap-2 pt-1">
                <template x-for="(p, i) in activeProject.photos" :key="i">
                  <button @click="activePhotoIndex = i" class="w-2.5 h-2.5 rounded-full transition-all" :class="activePhotoIndex === i ? 'bg-rose-500 w-5' : 'bg-slate-800'"></button>
                </template>
              </div>
            </template>
          </div>

          <div class="bg-slate-950/60 p-5 rounded-2xl border border-slate-800 text-left font-sans">
            <p class="text-slate-300 text-sm whitespace-pre-line leading-relaxed" x-text="activeProject.message || 'Momen manis bersama...'"></p>
          </div>

          <button @click="copyShareLink(activeProject)" class="w-full bg-gradient-to-r from-rose-600 to-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg shadow-rose-950 text-sm hover:opacity-90 transition-all">
            📋 Bagikan Link Ucapan Ini
          </button>
        </div>
      </template>

      <!-- ================= TEMA 3: PASTEL DREAM ================= -->
      <template x-if="activeProject.theme === 'pastel'">
        <div class="max-w-md w-full my-12 bg-white/90 backdrop-blur-md rounded-[2.5rem] p-6 md:p-8 shadow-xl border-4 border-purple-200 text-center space-y-6">
          <div>
            <span class="inline-block bg-purple-100 text-purple-600 text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm" x-text="getBadgeText(activeProject.type)"></span>
          </div>

          <h1 class="text-2xl md:text-3xl font-bold text-purple-900 leading-tight" x-text="activeProject.title || 'Dear My Love'"></h1>

          <div class="bg-purple-50 rounded-3xl p-5 border border-purple-100 shadow-inner">
            <p class="text-xs font-bold text-purple-500 uppercase tracking-wider mb-3" x-text="getCounterTitle(activeProject.type)"></p>
            <div class="grid grid-cols-3 gap-2">
              <div class="bg-white p-3 rounded-2xl shadow-sm border border-pink-100">
                <span class="block text-2xl font-bold text-pink-500" x-text="calculateDays(activeProject.startDate).years"></span>
                <span class="text-[10px] text-purple-400 font-bold uppercase">Tahun</span>
              </div>
              <div class="bg-white p-3 rounded-2xl shadow-sm border border-purple-100">
                <span class="block text-2xl font-bold text-purple-500" x-text="calculateDays(activeProject.startDate).months"></span>
                <span class="text-[10px] text-purple-400 font-bold uppercase">Bulan</span>
              </div>
              <div class="bg-white p-3 rounded-2xl shadow-sm border border-blue-100">
                <span class="block text-2xl font-bold text-blue-500" x-text="calculateDays(activeProject.startDate).days"></span>
                <span class="text-[10px] text-purple-400 font-bold uppercase">Hari</span>
              </div>
            </div>
          </div>

          <div class="relative space-y-2">
            <div class="bg-pink-100 p-2.5 rounded-[2rem] border-2 border-pink-200 shadow-sm">
              <img :src="activeProject.photos[activePhotoIndex] || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=800'" class="w-full h-64 object-cover rounded-[1.5rem]" />
            </div>
            <template x-if="activeProject.photos.length > 1">
              <div class="flex items-center justify-center gap-2 pt-1">
                <template x-for="(p, i) in activeProject.photos" :key="i">
                  <button @click="activePhotoIndex = i" class="w-3 h-3 rounded-full transition-all" :class="activePhotoIndex === i ? 'bg-purple-500 w-6' : 'bg-purple-200'"></button>
                </template>
              </div>
            </template>
          </div>

          <div class="bg-pink-50/70 p-5 rounded-3xl border border-pink-100 text-left">
            <p class="text-purple-900 text-sm whitespace-pre-line leading-relaxed font-medium" x-text="activeProject.message || 'Momen manis bersama...'"></p>
          </div>

          <button @click="copyShareLink(activeProject)" class="w-full bg-purple-400 hover:bg-purple-500 text-white font-bold py-3.5 rounded-2xl shadow-md text-sm transition-all">
            ✨ Bagikan Link Ucapan Ini
          </button>
        </div>
      </template>

      <!-- ================= TEMA 4: POP ART KARTUN ================= -->
      <template x-if="activeProject.theme === 'kartun'">
        <div class="max-w-md w-full my-12 bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] rounded-2xl p-6 md:p-8 text-center space-y-6 font-cartoon">
          <div>
            <span class="inline-block bg-yellow-300 border-2 border-black font-black uppercase text-xs px-4 py-1.5 rounded-md shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]" x-text="getBadgeText(activeProject.type)"></span>
          </div>

          <h1 class="text-3xl font-black text-black leading-tight uppercase tracking-wide" x-text="activeProject.title || 'Dear My Love'"></h1>

          <div class="bg-cyan-300 border-3 border-black p-4 rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
            <p class="text-xs font-black uppercase mb-2 text-black" x-text="getCounterTitle(activeProject.type)"></p>
            <div class="grid grid-cols-3 gap-2">
              <div class="bg-white p-2 border-2 border-black rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <span class="block text-2xl font-black text-rose-500" x-text="calculateDays(activeProject.startDate).years"></span>
                <span class="text-[10px] font-bold uppercase text-black">Tahun</span>
              </div>
              <div class="bg-white p-2 border-2 border-black rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <span class="block text-2xl font-black text-rose-500" x-text="calculateDays(activeProject.startDate).months"></span>
                <span class="text-[10px] font-bold uppercase text-black">Bulan</span>
              </div>
              <div class="bg-white p-2 border-2 border-black rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                <span class="block text-2xl font-black text-rose-500" x-text="calculateDays(activeProject.startDate).days"></span>
                <span class="text-[10px] font-bold uppercase text-black">Hari</span>
              </div>
            </div>
          </div>

          <div class="relative space-y-2">
            <div class="bg-white p-2 border-4 border-black rounded-xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
              <img :src="activeProject.photos[activePhotoIndex] || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&q=80&w=800'" class="w-full h-64 object-cover border-2 border-black rounded-lg" />
            </div>
            <template x-if="activeProject.photos.length > 1">
              <div class="flex items-center justify-center gap-2 pt-1">
                <template x-for="(p, i) in activeProject.photos" :key="i">
                  <button @click="activePhotoIndex = i" class="w-3 h-3 border border-black rounded-full transition-all" :class="activePhotoIndex === i ? 'bg-yellow-400 w-6' : 'bg-white'"></button>
                </template>
              </div>
            </template>
          </div>

          <div class="bg-pink-300 border-3 border-black p-4 rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-left">
            <p class="text-black text-sm font-bold whitespace-pre-line leading-relaxed" x-text="activeProject.message || 'Momen manis bersama...'"></p>
          </div>

          <button @click="copyShareLink(activeProject)" class="w-full bg-rose-500 text-white font-black py-3 rounded-xl border-3 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-sm active:translate-x-1 active:translate-y-1 active:shadow-none transition-all">
            🚀 BAGIKAN LINK SEKARANG
          </button>
        </div>
      </template>

    </div>

  </main>

</body>
</html>
